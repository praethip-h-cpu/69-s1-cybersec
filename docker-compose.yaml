services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "54321:5432"
    environment:
      POSTGRES_PASSWORD: 120975922Aa
      POSTGRES_USER: praethip
      POSTGRES_DB: praethip
    volumes:
      - ./data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: praethip-h@rmutp.ac.th
      PGADMIN_DEFAULT_PASSWORD: 120975922Aa
    volumes:
      - ./pgadmin:/var/lib/pgadmin

  app:
    image: prawee/strapi
    container_name: 69-s1-app
    depends_on:
      - db
    ports:
      - "9092:1337"
    environment:
      DATABASE_CLIENT: postgres
      DATABASE_HOST: host.docker.internal
      DATABASE_PORT: 54321
      DATABASE_NAME: praethip
      DATABASE_USERNAME: praethip
      DATABASE_PASSWORD: 120975922Aa
    restart: unless-stopped
