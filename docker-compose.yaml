services:
  db:
    image: postgres:16-alpine
    container_name: 69-s1-db
    ports:
      - "54327:5432"
    environment:
      POSTGRES_PASSWORD: 120975922Aa
      POSTGRES_USER: praethip
      POSTGRES_DB: praethip
    volumes:
      - ./data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s1-admin
    depends_on:
      - db
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: praethip-h@rmutp.ac.th
      PGADMIN_DEFAULT_PASSWORD: 120975922Aa
    volumes:
      - data-pgadmin:/var/lib/pgadmin

  app:
    image: prawee/strapi
    container_name: 69-s1-app
    ports:
      - 9091:1337
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_NAME=praethip
      - DATABASE_HOST=192.168.1.161
      - DATABASE_PORT=54327
      - DATABASE_USERNAME=praethip
      - DATABASE_PASSWORD=120975922Aa

volumes:
  data-pgadmin:
